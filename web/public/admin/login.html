<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/admin/auth.js"></script>
  <meta charset="UTF-8">
  <link rel="preload" href="/admin/fonts/figtree-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Mochan Labs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }
    /* Soft blue glow, as on the site's hero */
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(45% 40% at 85% 15%, rgb(43 89 255 / 0.12), transparent 70%),
        radial-gradient(40% 35% at 5% 95%, rgb(43 89 255 / 0.08), transparent 70%);
    }

    .login-card {
      position: relative; z-index: 1;
      width: 420px; max-width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px 32px;
      box-shadow: 0 30px 80px -40px rgb(10 10 10 / 0.35);
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
    .brand img { height: 36px; width: auto; }
    .brand span { font-size: 1.1rem; font-weight: 500; letter-spacing: -0.01em; }

    .label {
      font-size: 0.8rem; color: var(--muted); margin-bottom: 10px;
    }
    .login-title { font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 8px; }
    .login-title em { font-style: normal; color: var(--accent); }
    .login-sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 28px; line-height: 1.5; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .input-wrap i.lead {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--faint); font-size: 0.85rem; pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 12px 40px 12px 38px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input::placeholder { color: rgba(10, 10, 10, 0.35); }
    .toggle-pw {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--faint); font-size: 0.9rem; padding: 6px 8px;
    }
    .toggle-pw:hover { color: var(--text); }

    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: var(--accent);
      border: none; border-radius: 4px;
      color: #fff; font-weight: 500; font-size: 0.95rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background-color 0.25s;
    }
    .btn-login:hover { background: var(--accent-deep); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      border: 1px solid rgba(220, 38, 38, 0.25);
      background: rgba(220, 38, 38, 0.06);
      color: var(--red); border-radius: 4px;
      padding: 10px 14px; font-size: 0.85rem;
      margin-top: 14px; display: none; text-align: center;
    }

    .demo-note {
      margin-top: 18px; padding: 10px 12px;
      border: 1px dashed var(--border); border-radius: 4px;
      font-size: 0.8rem; color: var(--muted); text-align: center;
    }
    .demo-note b { color: var(--text); font-weight: 600; }

    .back-link { display: block; text-align: center; margin-top: 22px; color: var(--muted); font-size: 0.85rem; }
    .back-link a { color: var(--accent); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <img src="/brand/mark.png" alt="Mochan Labs logo">
      <span>Mochan Labs</span>
    </div>
    <p class="label">Admin</p>
    <h1 class="login-title">Welcome <em>back.</em></h1>
    <p class="login-sub">Sign in to manage invoices, transactions and employees.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <i class="fas fa-user lead"></i>
          <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock lead"></i>
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show/hide password">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i>
        <span id="loginBtnText">Login to Dashboard</span>
      </button>
      <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>
    </form>

    <p class="back-link"><a href="/"><i class="fas fa-arrow-left"></i> Back to website</a></p>
  </div>

  <script src="/admin/login.js"></script>
</body>
</html>
